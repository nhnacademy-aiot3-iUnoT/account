services:
  account-1:
    image: ghcr.io/${GHCR_OWNER:-nhnacademy-aiot3-iunot}/account:${IMAGE_TAG:-latest}
    container_name: team1-account-1 # 도커 네트워크 안에서 다른 컨테이너가 이 이름으로 접근 (예: 게이트웨이가 team1-front:10402로 호출)
    environment:
      SERVER_PORT: 10413
      SPRING_PROFILES_ACTIVE: prod
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/var/lib/account/keys/jwt-private.pem}
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE:-http://team1-eureka-1:10402/eureka/,http://team1-eureka-2:10403/eureka/}
      ZIPKIN_ENDPOINT: ${ZIPKIN_ENDPOINT:-http://team1-zipkin:9411/api/v2/spans}
    ports:
      - "127.0.0.1:10413:10413"   # 호스트포트(컨테이너 외부로 노출할 포트):컨테이너포트(실제 서비스 포트)
    restart: unless-stopped       # 컨테이너 죽으면 자동재시작, 수동으로 stop한 경우엔 안 살림
    logging:
      driver: json-file           # 도커 기본 로깅 드라이버, 로그를 파일로 저장
      options:
        max-size: "10m"           # 로그파일 하나당 최대 10MB
        max-file: "3"             # 최대 3개까지만 보관 (넘으면 오래된 것부터 삭제)
    volumes:
      - account-jwt-keys:/var/lib/account/keys
    networks: [team1-network]
  account-2:
    image: ghcr.io/${GHCR_OWNER:-nhnacademy-aiot3-iunot}/account:${IMAGE_TAG:-latest}
    container_name: team1-account-2
    environment:
      SERVER_PORT: 10414
      SPRING_PROFILES_ACTIVE: prod
      JWT_PRIVATE_KEY_PATH: ${JWT_PRIVATE_KEY_PATH:-/var/lib/account/keys/jwt-private.pem}
      EUREKA_DEFAULT_ZONE: ${EUREKA_DEFAULT_ZONE:-http://team1-eureka-1:10402/eureka/,http://team1-eureka-2:10403/eureka/}
      ZIPKIN_ENDPOINT: ${ZIPKIN_ENDPOINT:-http://team1-zipkin:9411/api/v2/spans}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:10414:10414"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - account-jwt-keys:/var/lib/account/keys
    networks: [team1-network]

volumes:
  account-jwt-keys:

networks:
  team1-network:
    external: true
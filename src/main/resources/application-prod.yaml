eureka:
  instance:
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE}

logging:
  level:
    com.nhnacademy.account: INFO

management:
  endpoints:
    web:
      exposure:
        include: health, service-registry, prometheus
  tracing:
    export:
      zipkin:
        endpoint: ${ZIPKIN_ENDPOINT}

security:
  jwt:
    issuer: ${JWT_ISSUER:account-api}
    audiences:
      - account-api
    allowed-algorithms:
      - rs256
    private-key-path: ${JWT_PRIVATE_KEY_PATH:/var/lib/account/keys/jwt-private.pem}

nhn:
  server-host: https://iunot.cloud

spring:
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:account}}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate

clients:
  inventory:
    base-url: ${INVENTORY_BASE_URL:http://inventory}

eureka:
  client:
    enabled: false

security:
  jwt:
    issuer: ${JWT_ISSUER:account-api}
    audiences:
      - account-api
    allowed-algorithms:
      - rs256

nhn:
  server-host: http://localhost:10404

spring:
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: jdbc:h2:mem:account;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop

management:
  tracing:
    export:
      zipkin:
        enabled: false

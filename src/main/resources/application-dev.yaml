eureka:
  client:
    enabled: false

management:
  tracing:
    export:
      zipkin:
        enabled: false

security:
  jwt:
    issuer: ${JWT_ISSUER:account-api}
    audiences:
      - account-api
    allowed-algorithms:
      - rs256
    private-key-path: ${JWT_PRIVATE_KEY_PATH:./keys/jwt-private.pem}

nhn:
  server-host: http://localhost:10404

clients:
  inventory:
    base-url: ${INVENTORY_BASE_URL:http://localhost:10411}

spring:
  config:
    import: optional:file:./.env[.properties]
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:account}}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate

spring:
  application:
    name: account
  jpa:
    open-in-view: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8

    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true

      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 36

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health, service-registry
  endpoint:
    health:
      show-details: never

server:
  port: ${SERVER_PORT:10413}

security:
  jwt:
    issuer: account-api
    jwk-set-uri: http://localhost:${server.port:8080}/.well-known/jwks.json
    audiences:
      - account-api
    allowed-algorithms:
      - rs256
    private-key-path: ${JWT_PRIVATE_KEY_PATH:${java.io.tmpdir}/account/jwt-private.pem}

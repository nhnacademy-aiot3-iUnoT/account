spring:
  application:
    name: account
  profiles:
    default: dev
  jpa:
    open-in-view: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8

    properties:
      "[mail.smtp.auth]": true
      "[mail.smtp.starttls.enable]": true

      "[mail.smtp.connectiontimeout]": 5000
      "[mail.smtp.timeout]": 5000
      "[mail.smtp.writetimeout]": 5000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_RANGE:36}

management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health, service-registry
  endpoint:
    health:
      show-details: never

server:
  port: ${SERVER_PORT:10413}

security:
  jwt:
    issuer: ${JWT_ISSUER:account-api}
    issued-audiences:
      - account-api
      - inventory-api
      - rule-engine
    access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:30m}
    key-id: ${JWT_KEY_ID:account-key-001}
    audiences:
      - account-api
    allowed-algorithms:
      - rs256
    private-key-path: ${JWT_PRIVATE_KEY_PATH:${java.io.tmpdir}/account/jwt-private.pem}
  refresh-token:
    ttl: ${REFRESH_TOKEN_TTL:14d}

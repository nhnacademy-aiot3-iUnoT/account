spring.application.name=account

spring.jpa.open-in-view=false

# JWT verification is opt-in. API services configure the trusted issuer and JWK Set.
nhn.auth.jwt.enabled=true
nhn.auth.jwt.issuer=account-api
nhn.auth.jwt.jwk-set-uri=http://localhost:${server.port:8080}/.well-known/jwks.json
nhn.auth.jwt.audiences=account-api
nhn.auth.jwt.allowed-algorithms=RS256
